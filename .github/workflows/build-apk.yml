name: Build Save Adda APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o SaveAddaAndroid-AdMob.zip -d extracted
          cp -r extracted/* .
          rm -rf extracted

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Fix JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "android {\n",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              """
              )

          if "kotlin {" not in s:
              s += """

          kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }
          """

          p.write_text(s)
          PY

      - name: Build APK
  run: gradle assembleDebug --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaveAdda-APK
          path: app/build/outputs/apk/debug/app-debug.apk
